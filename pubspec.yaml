name: kimgane
description: 광산김씨 김가네 가족 생일·제사·경조사 일정
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  intl: ^0.20.2
  korean_lunar_utils: ^1.0.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  printing: ^5.14.2
  pdf: ^3.11.3
  table_calendar: ^3.2.0
  collection: ^1.19.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.png
  adaptive_icon_foreground_inset: 12
  background_color_ios: "#FFFFFF"
  remove_alpha_ios: true
  remove_alpha_macos: true

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/jikgye_seonjo_myobi.jpeg
    - assets/images/family_stone_36_front.jpeg
    - assets/images/family_stone_36_back.jpeg
    - assets/images/family_stone_37_front.jpeg
    - assets/images/family_stone_37_back.jpeg
    - assets/images/jesa_sangcharim.jpeg
    - assets/images/app_icon_a.png
    - assets/images/app_icon_b.png
    - assets/images/app_icon_c.png
  fonts:
    - family: NanumMyeongjo
      fonts:
        - asset: assets/fonts/NanumMyeongjo-Regular.ttf
        - asset: assets/fonts/NanumMyeongjo-Bold.ttf
          weight: 700
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic-Regular.ttf
        - asset: assets/fonts/NanumGothic-Bold.ttf
          weight: 700
    - family: NotoSerifKRBlack
      fonts:
        - asset: assets/fonts/NotoSerifKR-Black.ttf
          weight: 900
    - family: NotoSerifKR
      fonts:
        - asset: assets/fonts/NotoSerifKR-Hanja.ttf
          weight: 700
